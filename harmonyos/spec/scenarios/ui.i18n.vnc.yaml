schema: 1
id: ui.i18n.vnc
title: 面板级双语（三）：VNC 面板按钮随语言切换，且无缺键
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - H08
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 4000
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "New Host|新建主机"
      withinMs: 20000
  - action: click
    target: id:ui/lang
  - action: wait
    ms: 800
  - action: click
    target: id:diag/open
  - action: wait
    ms: 1000
  - action: click
    target: id:vnc/session
  - action: wait
    ms: 3500
    expect:
      kind: screenRegex
      regex: "frame=[1-9][0-9]*"
      withinMs: 20000
asserts:
  - kind: screenRegex
    regex: "发送按键 a"
    withinMs: 10000
  - kind: screenRegex
    regex: "发送指针"
    withinMs: 6000
  - kind: absent
    value: "Send key a"
    withinMs: 3000
  - kind: absent
    value: "Send pointer"
    withinMs: 3000
  - kind: absent
    value: "vnc.key"
    withinMs: 2000
  - kind: absent
    value: "vnc.pointer"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    模拟器双画像（x86_64, API 26）。覆盖：VNC 面板指针/按键按钮的中英取词、切换后文案变化、
    缺键反向检测。
    **不覆盖**：剪贴板与状态行的逐条覆盖、第三种语言、系统语言跟随；未在 arm64 真机执行。
deviations:
  - 纯新增规格，无 upstream 对应脚本
notes: >-
  反向断言英文原文与键名同时缺席，才说明按钮确实走了取词表。
