schema: 1
id: settings.font-size
title: 终端字号可调（设置面板 +/-），重启后保持
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "字号 13 (10–24)|字号 13 \\(10–24\\)|字号 13"
      withinMs: 8000
  - action: click
    target: id:settings/font-inc
  - action: click
    target: id:settings/font-inc
  - action: wait
    ms: 600
    expect:
      kind: screenRegex
      regex: "字号 15"
      withinMs: 6000
  - action: click
    target: id:settings/font-dec
  - action: wait
    ms: 600
    expect:
      kind: screenRegex
      regex: "字号 14"
      withinMs: 6000
  - action: click
    target: id:settings/close
  - action: wait
    ms: 500
  # 重启后保持 14
  - action: restart
  - action: wait
    ms: 6000
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "字号 14"
      withinMs: 10000
asserts:
  - kind: screenRegex
    regex: "字号 14"
    withinMs: 8000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：设置面板有字号 +/-；点击改变数值（13 -> 15 -> 14）；重启后保持 14（DB 持久化）。
    **不覆盖**：终端输出文本的**实际像素字号**（dump 不含 fontSize，字号是否作用到渲染属于代码层 E2）。
deviations:
  - 默认 13；范围 10~24，边界处按钮置灰（本轮加入），数值不越界；用例只断言数值变化与范围文案。
notes: >-
  termFontSize 存在 DB ui_state；终端输出 Text 的 fontSize 绑定到它。
