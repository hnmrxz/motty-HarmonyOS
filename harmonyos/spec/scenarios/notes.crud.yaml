schema: 1
id: notes.crud
title: 笔记页：空态 -> 新建 -> 列表可见 -> 编辑 -> 删除回到空态
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  # 备份恢复会带回旧数据，先重置（含 notes）
  - action: click
    target: id:diag/open
  - action: wait
    ms: 1200
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 800
  - action: click
    target: id:nav/notes
  - action: wait
    ms: 1200
    expect:
      kind: screenRegex
      regex: "还没有笔记|No notes yet"
      withinMs: 10000
  - action: click
    target: id:note/add
  - action: wait
    ms: 800
  - action: type
    target: id:note/dialog-title
    text: note-a
  - action: type
    target: id:note/dialog-body
    text: body-first
  - action: click
    target: id:note/dialog-save
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "note-a"
      withinMs: 12000
  # 编辑：回填后追加
  - action: click
    target: id:note/edit/0
  - action: wait
    ms: 900
  - action: type
    target: id:note/dialog-title
    text: -v2
  - action: click
    target: id:note/dialog-save
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "note-a-v2"
      withinMs: 12000
  # 删除
  - action: click
    target: id:note/del/0
  - action: wait
    ms: 1500
asserts:
  - kind: screenRegex
    regex: "还没有笔记|No notes yet"
    withinMs: 12000
  - kind: absent
    value: "note/dialog-title"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：空态、新建（标题+正文落库并渲染）、编辑（回填后追加可见）、删除后回到空态。
    **不覆盖**：正文多行富文本、搜索/排序、跨设备同步、与上游（无此页）的一致性。
deviations:
  - 该页面是自研扩展：上游导航里没有"笔记"，保留它是因为前面版本已提供入口；文档已标注差异。
notes: >-
  行内按钮用索引 id（note/edit|del/<idx>），与主机行、快捷命令行一致，便于用例化。
