schema: 1
id: ui.view-options
title: 主机页「视图选项」：切换网格/列表与显示开关，不再是死图标
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:view/order
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "视图|视图选项|列表视图|Grid view"
      withinMs: 8000
  - action: click
    target: id:viewmenu/grid
  - action: wait
    ms: 900
asserts:
  - kind: absent
    value: "viewmenu/panel"
    withinMs: 4000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：主机页 view/order 打开视图选项菜单，点"网格视图"后菜单关闭。
    **不覆盖**：切到网格后的列表渲染（由 host.grid-meta 覆盖）、排序/显示开关两项（同一实现路径）。
deviations:
  - 菜单关闭用 absent(viewmenu/panel) 断言，不比对具体网格节点。
notes: >-
  之前 view/order 是死图标（无 onClick）。
