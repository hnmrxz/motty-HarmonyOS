schema: 1
id: settings.categories
title: 设置两栏分类：通用/主机列表/终端/启动/关于 切换生效
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "通用|General"
      withinMs: 8000
  - action: click
    target: id:settings/cat-terminal
  - action: wait
    ms: 700
    expect:
      kind: screenRegex
      regex: "10–24"
      withinMs: 6000
  - action: click
    target: id:settings/cat-startup
  - action: wait
    ms: 700
  - action: click
    target: id:settings/cat-about
  - action: wait
    ms: 700
asserts:
  - kind: screenRegex
    regex: "Apache-2.0"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：设置左栏五个分类存在；切到"终端"出现字号 10–24；切到"关于"出现 Apache-2.0 说明。
    **不覆盖**：每个分类内所有控件的逐一断言（其余 id 由既有 settings.* 用例覆盖，但那些用例默认在"通用"分类下，
    可能需要先点 settings/cat-* 才能看到 —— 见 deviations）。
deviations:
  - 设置改为分类后，旧用例（settings.font-size 等）需先切到对应分类；本轮已把断言改在对应分类内。
notes: >-
  settingsCat 控制右侧内容；catItem(...) 渲染左栏按钮。
