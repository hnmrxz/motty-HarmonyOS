schema: 1
id: page.monitor
title: 监控页：主机列表、简洁/详细切换、采集间隔与保留时长
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/monitor
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "监控|Monitor"
      withinMs: 8000
  - action: click
    target: id:monitor/toggle-detail
  - action: wait
    ms: 700
  - action: click
    target: id:monitor/every
  - action: wait
    ms: 600
asserts:
  - kind: screenRegex
    regex: "15s|30s"
    withinMs: 6000
  - kind: screenRegex
    regex: "保留 1 小时|keep 1h"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：侧栏"监控"可进入，页面有简洁/详细切换、采集间隔按钮（点一次变 15s/30s）、保留时长按钮。
    **不覆盖**：真实 CPU/内存/磁盘采集数值（需已连接并已信任主机；`monitor/sample` 走 SSH exec，
    在无凭据时只显示"未连接"）。
deviations:
  - 采集用 `cat /proc/loadavg; free -m; df -h /` 的原始输出截断展示，未做百分比条形图（上游有）。
notes: >-
  nav/monitor -> monitorPage；monitorRows 由 reloadMonitor() 从 hosts 聚合。
