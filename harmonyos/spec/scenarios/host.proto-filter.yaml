schema: 1
id: host.proto-filter
title: 协议筛选：表单里选 SSH/RDP/VNC，chips 能按协议精确筛选
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 1000
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 800
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 800
  # 建 SSH 主机
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: pf-ssh
  - action: type
    target: id:shell/dialog-address
    text: 10.9.9.1
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1300
  # 建 RDP 主机（表单里选 RDP，端口自动 3389）
  - action: click
    target: id:shell/add-host
  # 先选协议再输入：点 chip 会让输入框失焦（实测会把已输入内容清掉）
  - action: click
    target: id:hostform/proto-rdp
  - action: type
    target: id:shell/dialog-label
    text: pf-rdp
  - action: type
    target: id:shell/dialog-address
    text: 10.9.9.2
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1300
  # 建 VNC 主机（表单里选 VNC，端口自动 5900）
  - action: click
    target: id:shell/add-host
  - action: click
    target: id:hostform/proto-vnc
  - action: type
    target: id:shell/dialog-label
    text: pf-vnc
  - action: type
    target: id:shell/dialog-address
    text: 10.9.9.3
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
  # RDP 协议：只剩 pf-rdp
  - action: click
    target: id:chips/proto-rdp
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "pf-rdp"
      withinMs: 8000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 300
  - action: click
    target: id:diag/close
  - action: wait
    ms: 300
  # VNC 协议：只剩 pf-vnc
  - action: click
    target: id:chips/proto-vnc
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "pf-vnc"
      withinMs: 8000
  # 回到全部协议
  - action: click
    target: id:chips/proto-all
  - action: wait
    ms: 900
asserts:
  - kind: screenRegex
    regex: "pf-ssh"
    withinMs: 8000
  - kind: screenRegex
    regex: "pf-rdp"
    withinMs: 6000
  - kind: screenRegex
    regex: "pf-vnc"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：表单里可切 SSH/RDP/VNC 并落库（端口按协议给默认值），
    协议 chips 选 RDP / VNC 时只显示对应主机，选「全部协议」后三台都回来。
    **不覆盖**：编辑主机时改协议、协议 chips 与搜索/分组组合、协议状态持久化。
deviations:
  - 只断言"选中协议后目标主机可见"，不用 absent 断别的主机，避免列表虚拟化/裁剪带来的误判。
notes: >-
  协议选择是 Round 63 新加的表单字段；这条用例同时覆盖"表单 → 落库 → chips 过滤"的闭环。
