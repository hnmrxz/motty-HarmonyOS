schema: 1
id: host.proto-filter
title: 协议筛选：SSH/RDP/VNC chips 只显示对应协议的主机，"全部协议"恢复
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 1000
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 800
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 800
  # 建三台：ssh / rdp / vnc
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: pf-ssh
  - action: type
    target: id:shell/dialog-address
    text: 10.9.9.1
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1300
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: pf-rdp
  - action: type
    target: id:shell/dialog-address
    text: 10.9.9.2
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1300
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: pf-vnc
  - action: type
    target: id:shell/dialog-address
    text: 10.9.9.3
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
  # 点 RDP 协议 chip：只剩 rdp（这里没有 rdp 主机，因此应显示"没有匹配"）
  - action: click
    target: id:chips/proto-rdp
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "没有匹配|No match"
      withinMs: 8000
  # 回到全部协议：三台都在
  - action: click
    target: id:chips/proto-all
  - action: wait
    ms: 900
asserts:
  - kind: screenRegex
    regex: "pf-ssh"
    withinMs: 8000
  - kind: screenRegex
    regex: "pf-vnc"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：协议 chips（全部协议/SSH/RDP/VNC）存在且可点；选 RDP 时无匹配显示空态；
    选回"全部协议"后其它主机恢复显示。
    **不覆盖**：协议 chips 与搜索/分组筛选的组合、协议 chips 的状态持久化。
deviations:
  - 用例建的 3 台主机都是 SSH 协议（新建对话框没有协议选择），所以"选 RDP 无匹配"是正确预期。
notes: >-
  协议 chips 的计数来自 countProto；筛选逻辑并入 matchesQuery，因此列表/网格/计数三处一致。
