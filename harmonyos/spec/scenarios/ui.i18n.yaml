schema: 1
id: ui.i18n
title: 中英双语切换：顶栏与主机区文案随语言按钮变化，且无缺键
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - H08
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  # 该模拟器系统语言为中文，应用默认跟随系统 => 中文
  - action: wait
    ms: 600
    expect:
      kind: screenRegex
      regex: "新建主机"
      withinMs: 10000
  - action: wait
    ms: 300
    expect:
      kind: screenRegex
      regex: "还没有主机"
      withinMs: 6000
  # 切到英文
  - action: click
    target: id:ui/lang
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "New Host"
      withinMs: 8000
  - action: wait
    ms: 300
    expect:
      kind: screenRegex
      regex: "No hosts yet"
      withinMs: 6000
  # 切回中文
  - action: click
    target: id:ui/lang
  - action: wait
    ms: 800
asserts:
  - kind: screenRegex
    regex: "新建主机"
    withinMs: 8000
  - kind: absent
    value: "New Host"
    withinMs: 3000
  # 缺键会以键名显示（如 top.newHost / host.empty），这里必须一个都不出现
  - kind: absent
    value: "top.newHost"
    withinMs: 2000
  - kind: absent
    value: "host.empty"
    withinMs: 2000
  - kind: absent
    value: "undefined"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：中文默认（跟随系统）、切英文、切回中文的三段文案与空态文案。
    **不覆盖**：平板画像（平板特性暂停）、随系统语言热切换、其它面板的逐条文案（另有 ui.i18n.panels）。
deviations:
  - 该模拟器系统语言是中文，应用默认跟随系统，所以起始断言是中文而不是英文（旧版按"默认英文"写，已修正）
notes: >-
  这条用例第一次在英文默认假设下写，语言改成跟随系统后就必然失败；这里改成中->英->中三段，才是可复现的。
