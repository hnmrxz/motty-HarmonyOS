schema: 1
id: cred.cleared
title: 密钥链删除凭据后，再连接应明确提示无凭据（而不是静默失败）
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  # 卸载重装会被备份恢复数据，先显式重置
  - action: click
    target: id:diag/open
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts|RDP 服务启动"
      withinMs: 10000
  - action: wait
    ms: 600
  # 面板已分页：调试类按钮在「调试」页
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts"
      withinMs: 10000
  - action: wait
    ms: 1200
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 900
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: cred-a
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 900
  # 先正常连接一次（会走信任流程），证明凭据确实可用
  - action: click
    target: id:host-open/0
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "信任此主机|Trust this host|Unknown host key"
      withinMs: 15000
  - action: click
    target: id:hostkey/trust
  - action: wait
    ms: 3000
  # 回主机列表 -> 打开密钥链 -> 删除该凭据
  - action: click
    target: id:nav/hosts
  - action: wait
    ms: 900
  - action: click
    target: id:nav/keys
  - action: wait
    ms: 1200
  - action: click
    target: id:vault/del/127.0.0.1:2222
  # 删除前必须确认（避免误删）
  - action: wait
    ms: 700
    expect:
      kind: screenRegex
      regex: "删除已保存的密码|Delete saved password"
      withinMs: 6000
  - action: click
    target: id:vaultdel/confirm
  - action: wait
    ms: 1200
  # 回主机列表再连接：应明确提示没有凭据
  - action: click
    target: id:nav/hosts
  - action: wait
    ms: 900
  - action: click
    target: id:host-open/0
  - action: wait
    ms: 1500
asserts:
  - kind: screenRegex
    regex: "no credentials in memory"
    withinMs: 12000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：建主机带口令 -> 信任并连接成功 -> 密钥链删除凭据 -> 再连接提示"无凭据"。
    **不覆盖**：删除后重新输入口令的完整回路、凭据在进程重启后的预热行为、多主机共享同一凭据。
deviations:
  - 旧版本这条用例断言"重启后仍无凭据"，但应用启动会从保险库预热凭据，该前提已不成立；
    现在按真实语义测试"删除即不可用"。
notes: >-
  这条用例曾经是"删除凭据后重启仍提示无凭据"，实现保险库之后重启会预热，于是永远失败。
  正确做法是直接在密钥链页删除条目（vault/del/<host:port>）再连接，不经过重启。
