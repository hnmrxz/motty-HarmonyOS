schema: 1
id: snippets.crud
title: 快捷命令：空态 -> 添加 -> 编辑 -> 删除 -> 回到空态
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  # 卸载重装会被备份恢复数据，先显式重置
  - action: click
    target: id:diag/open
  - action: wait
    ms: 1200
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 900
  - action: click
    target: id:nav/snippets
  - action: wait
    ms: 1400
    expect:
      kind: screenRegex
      regex: "快捷命令|Snippets"
      withinMs: 10000
  # 空态
  - action: wait
    ms: 300
    expect:
      kind: screenRegex
      regex: "还没有快捷命令|No snippets yet"
      withinMs: 8000
  # 添加
  - action: click
    target: id:snippet/add
  - action: wait
    ms: 800
  - action: type
    target: id:snippet/dialog-name
    text: nginx-restart
  - action: type
    target: id:snippet/dialog-cmd
    text: systemctl restart nginx
  - action: click
    target: id:snippet/dialog-save
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "nginx-restart"
      withinMs: 12000
  - action: wait
    ms: 300
    expect:
      kind: screenRegex
      regex: "systemctl restart nginx"
      withinMs: 8000
  # 编辑：在原名后追加 -reload（对话框会回填原名，输入是追加）
  - action: click
    target: id:snippet/edit/0
  - action: wait
    ms: 900
  - action: type
    target: id:snippet/dialog-name
    text: -reload
  - action: click
    target: id:snippet/dialog-save
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "nginx-restart-reload"
      withinMs: 12000
  # 删除：回到空态
  - action: click
    target: id:snippet/del/0
  - action: wait
    ms: 1500
asserts:
  - kind: screenRegex
    regex: "还没有快捷命令|No snippets yet"
    withinMs: 12000
  - kind: absent
    value: "snippet.title"
    withinMs: 2000
  - kind: absent
    value: "nginx-restart"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：空态、添加（名称+命令都渲染）、编辑（原名追加后可见）、删除后回到空态、键名不泄漏。
    **不覆盖**：发送到终端（需要活跃会话，另有会话类用例）、快捷键绑定、分组筛选、排序、右键调序。
deviations:
  - 编辑用"在回填的原名后追加 -reload"，因为 TextInput 会把光标放在末尾；断言写追加后的完整名称。
notes: >-
  行内按钮 id 用索引（snippet/send|edit|del/<idx>），与主机行一致；此前用插入时间戳导致无法用例化。
