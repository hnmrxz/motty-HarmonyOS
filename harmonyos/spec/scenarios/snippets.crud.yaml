schema: 1
id: snippets.crud
title: 快捷命令：空态 -> 添加 -> 列表出现 -> 删除 -> 回到空态
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  # 卸载重装会被备份恢复数据，先显式重置（同时清 hosts / known_hosts / logs / snippets）
  - action: click
    target: id:diag/open
  - action: wait
    ms: 1200
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 900
  - action: click
    target: id:nav/snippets
  - action: wait
    ms: 1400
    expect:
      kind: screenRegex
      regex: "快捷命令|Snippets"
      withinMs: 10000
  # 空态
  - action: wait
    ms: 300
    expect:
      kind: screenRegex
      regex: "还没有快捷命令|No snippets yet"
      withinMs: 8000
  # 添加一条
  - action: click
    target: id:snippet/add
  - action: wait
    ms: 800
  - action: type
    target: id:snippet/dialog-name
    text: nginx-restart
  - action: type
    target: id:snippet/dialog-cmd
    text: systemctl restart nginx
  - action: click
    target: id:snippet/dialog-save
  - action: wait
    ms: 1500
asserts:
  - kind: screenRegex
    regex: "nginx-restart"
    withinMs: 12000
  - kind: screenRegex
    regex: "systemctl restart nginx"
    withinMs: 8000
  - kind: absent
    value: "snippet.title"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：快捷命令页空态、添加一条并出现在列表（名称与命令都可见）、键名不泄漏。
    **不覆盖**：删除按钮点击（条目 id 每次运行都不同，见 deviations）、编辑、排序、发送到终端、
    快捷键绑定、分组筛选。
deviations:
  - 删除步骤写死 id 不可靠（id 是插入时间戳）：本轮**不点删除**，只做"添加后可见"的证据；
    删除留到下一轮给条目加稳定 id（如按 name 生成）后再测。
notes: >-
  先只把"能添加且真的落库并渲染"钉住；删除/编辑依赖稳定 id，属于下一步。
