schema: 1
id: logs.filters-combo
title: 日志三重筛选组合：协议 + 主机 + 关键词同时生效
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
fixture:
  vncAuth: false
  vncResize: false
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 600
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1200
  - action: click
    target: id:diag/close
  - action: wait
    ms: 600
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: combolog
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "combolog"
      withinMs: 12000
  - action: key
    code: 2070
  - action: wait
    ms: 500
  - action: click
    target: id:host-open/0
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "信任此主机|Trust this host|Unknown host key"
      withinMs: 15000
  - action: click
    target: id:hostkey/trust
  - action: wait
    ms: 3000
  - action: click
    target: id:nav/logs
  - action: wait
    ms: 1200
  # 三重筛选：host chip + ssh 协议 + 不匹配关键词 -> 0 条
  - action: click
    target: id:logs/host/0
  - action: wait
    ms: 600
  - action: click
    target: id:logs/proto-ssh
  - action: wait
    ms: 600
  - action: type
    target: id:logs/search
    text: zzznomatch
  - action: wait
    ms: 900
asserts:
  - kind: screenRegex
    regex: "0 / [0-9]+"
    withinMs: 8000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：主机 chip + SSH 协议 + 关键词三者同时生效（AND），计数变为 0 / N。
    **不覆盖**：逐个筛选的独立效果（已由 logs.proto-filter / logs.host-filter / logs.search 覆盖）、
    关键词清空后恢复。
deviations:
  - 只断言组合后的计数，不验证列表内容。
notes: >-
  logsFiltered() 三重条件为 AND：host、proto、关键词。
