schema: 1
id: terminal.key
title: 终端按键直发：Ctrl-C 原样写入通道（不追加换行），远端回显 ^C
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - B09
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: key-host
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 700
  # 打开真实 pty 会话（对端是 ConPTY 上的 cmd.exe，会回显 ^C）
  - action: click
    target: id:host-open/0
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "信任此主机|Unknown host key"
      withinMs: 12000
  - action: click
    target: id:hostkey/trust
  - action: wait
    ms: 4000
    expect:
      kind: screenRegex
      regex: "[A-Z]:\\\\"
      withinMs: 20000
  # 发 Ctrl-C
  - action: click
    target: id:terminal/ctrl-c
  - action: wait
    ms: 2000
asserts:
  - kind: screenRegex
    regex: "sent \\^C"
    withinMs: 8000
  - kind: screenRegex
    regex: "\\^C"
    withinMs: 8000
  - kind: absent
    value: "ctrl-c: no session"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    模拟器双画像（x86_64, API 26）。覆盖：控制字符**原样**写入 SSH 通道（不追加换行）、
    远端 shell 收到并把 ^C 回显到网格。
    **不覆盖**：方向键/功能键的转义序列映射、修饰键组合、Alt/Shift 语义、
    真实 Linux shell 的作业控制行为、鼠标上报；未在 arm64 真机执行。
deviations:
  - 纯新增规格，无 upstream 对应脚本
  - 对端是 Windows cmd.exe（ConPTY），^C 的显示形式与 Linux bash 不同
notes: >-
  关键点是"原样"：sendInput 会给每行补换行，Ctrl-C 若走那条路就变成"^C + 回车"两件事，
  语义完全不同。这条用例因此同时断言 UI 状态（sent ^C）与终端内容（^C 回显）。
