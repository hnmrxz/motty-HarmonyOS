schema: 1
id: vnc.handshake
title: VNC/RFB 3.8：握手 + None 安全类型 + Raw 帧解码取色
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - E01
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: click
    target: id:diag/open
  - action: click
    target: id:vnc/probe
  - action: wait
    ms: 3000
asserts:
  - kind: screenRegex
    regex: "fb=64x48"
    withinMs: 12000
  - kind: screenRegex
    regex: "name=motty-fixture"
    withinMs: 6000
  - kind: screenRegex
    regex: "top-left=FF0000"
    withinMs: 6000
  - kind: screenRegex
    regex: "right=0000FF"
    withinMs: 6000
  - kind: absent
    value: "error unsupported encoding"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    模拟器双画像（x86_64, API 26）。覆盖：RFB 3.8 版本协商、安全类型列表解析与 None 选择、
    SecurityResult、ClientInit/ServerInit 解析（尺寸/像素格式/名称）、SetEncodings(Raw)、
    FramebufferUpdateRequest、Raw 矩形解码并按 shift 还原 RGB。
    **不覆盖**：VNC Auth(DES)/VeNCrypt/TLS、Hextile/ZRLE/CopyRect/RRE 编码、
    增量更新与脏区、鼠标键盘事件上报、剪贴板、画面缩放与上屏（本帧只做取色，不做渲染）、
    多帧/断线重连。未在 arm64 真机执行。
deviations:
  - 纯新增规格，无 upstream 对应脚本
  - 对端是自研的最小 RFB 服务夹具（固定图案：左半红右半蓝），不是真实 VNC 服务器
notes: >-
  top-left=FF0000 与 right=0000FF 分别取自同一帧的左半区与右半区，
  若解码/移位/通道顺序有错，两者必然错位或相等——这比"连上了"强得多。
  明确没做 VNC Auth：缺 DES 实现，遇到只提供 VNC Auth 的服务器会返回明确错误而不是假装成功。
