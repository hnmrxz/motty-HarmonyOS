schema: 1
id: command.palette
title: 命令面板：打开、条目可点执行、关闭
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:top/search
  - action: wait
    ms: 1000
    expect:
      kind: screenRegex
      regex: "命令面板"
      withinMs: 8000
  - action: wait
    ms: 300
    expect:
      kind: screenRegex
      regex: "新建主机"
      withinMs: 6000
  # 点第一项（新建主机）执行 -> 应打开新建主机对话框
  - action: click
    target: id:palette/item/0
  - action: wait
    ms: 1200
asserts:
  - kind: screenRegex
    regex: "名称|Label"
    withinMs: 10000
  - kind: absent
    value: "命令面板"
    withinMs: 4000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：顶部搜索图标打开面板、条目列表渲染、点击条目执行（打开新建主机）、执行后面板关闭。
    **不覆盖**：输入过滤（见 deviations，runner 的 type 结尾会按 ENTER，而面板把 ENTER 当执行）、
    无匹配提示、鼠标悬停高亮。
deviations:
  - 输入过滤没有在这条用例里测：runner 的 type 动作结尾会按 ENTER（用于提交输入法），面板把 ENTER
    当作"执行当前条目"，两者冲突。键盘导航与回车执行由 command.palette-keys 覆盖。
notes: >-
  这条保留"能打开 + 能点执行"的最小闭环；键盘路径看 command.palette-keys，别用一条用例假装覆盖两件事。
