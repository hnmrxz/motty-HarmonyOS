schema: 1
id: host.menu
title: 主机行「⋯」菜单：打开/编辑/详情/复制/删除入口可用
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 600
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1200
  - action: click
    target: id:diag/close
  - action: wait
    ms: 600
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: menu-a
  - action: type
    target: id:shell/dialog-address
    text: 10.30.30.30
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "menu-a"
      withinMs: 12000
  - action: key
    code: 2070
  - action: wait
    ms: 500
  # 打开 ⋯ 菜单
  - action: click
    target: id:host-more/0
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "详情|Details"
      withinMs: 8000
  # 菜单里的"复制地址"应给出提示
  - action: click
    target: id:hostmenu/copy
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "copied 10.30.30.30|已复制 10.30.30.30|copy failed|copy threw|复制失败|复制异常|剪贴板未确认"
      withinMs: 8000
  # 再开菜单 -> 详情
  - action: click
    target: id:host-more/0
  - action: wait
    ms: 700
  - action: click
    target: id:hostmenu/detail
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "主机详情|Host details"
      withinMs: 8000
asserts:
  - kind: screenRegex
    regex: "主机详情|Host details"
    withinMs: 6000
  - kind: screenRegex
    regex: "menu-a"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：主机行 ⋯ 打开菜单；菜单"复制地址"给提示；菜单"详情"打开详情面板。
    **不覆盖**：菜单里"打开/编辑/删除"三项（同源实现，未逐一断言）、hover 显隐行为。
deviations:
  - 菜单为自绘（bindMenu 不在 uitest dump），故用 hostmenu/* 一批 id。
notes: >-
  ⋯ 与 ⎘/ⓘ 同处名称列（纵向堆叠），不增加行宽。
