schema: 1
id: jump.page
title: 跳板路由页：明确说明未实现 + 指向端口转发替代，不再是死链
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/jump
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "跳板路由|Jump routes"
      withinMs: 8000
asserts:
  - kind: screenRegex
    regex: "libssh2|transport|无法可靠实现"
    withinMs: 6000
  - kind: screenRegex
    regex: "端口转发|Port Forwarding"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：跳板路由项不再是死链，页面显示"未实现的原因 + 替代方案"。
    **不覆盖**：真正的 ProxyJump 功能（未实现，见页面文案）。
deviations:
  - 这是"诚实说明页"，不是功能实现；目的是消除死链并给出可行替代。
notes: >-
  ProxyJump 需要 libssh2 之上的可插拔 transport，属大改；本页明确告知用户并指向端口转发。
