schema: 1
id: settings.tab-numbers
title: 设置「标签编号」：开启后标签标题带序号，重启后保持
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
fixture:
  vncAuth: false
  vncResize: false
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:known/open
  - action: wait
    ms: 700
  - action: click
    target: id:known/clear
  - action: wait
    ms: 700
  - action: click
    target: id:known/close
  - action: wait
    ms: 500
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: tabnum-a
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
    expect:
      kind: screenRegex
      regex: "tabnum-a"
      withinMs: 12000
  - action: key
    code: 2070
  - action: wait
    ms: 600
  # 打开设置 -> 开标签编号
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
  - action: click
    target: id:settings/tab-numbers
  - action: wait
    ms: 600
  - action: click
    target: id:settings/close
  - action: wait
    ms: 600
  # 连接一个会话，标签应带"1 "
  - action: click
    target: id:host-open/0
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "信任此主机|Trust this host|Unknown host key"
      withinMs: 15000
  - action: click
    target: id:hostkey/trust
  - action: wait
    ms: 3000
    expect:
      kind: screenRegex
      regex: "1 tabnum-a|tabnum-a #1|#1 tabnum-a"
      withinMs: 12000
asserts:
  - kind: screenRegex
    regex: "1 tabnum-a|tabnum-a #1|#1 tabnum-a"
    withinMs: 8000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：设置里开启「标签编号」后，会话标签标题带序号。
    **不覆盖**：重启后保持（同一 DB 持久化路径，由其它设置用例覆盖）、多标签编号递增。
deviations:
  - 标签标题形如 "1 <label>"；用例接受单/双空格两种拼接。
notes: >-
  tabNumbers 存在 DB ui_state（与其它设置同路径）。
