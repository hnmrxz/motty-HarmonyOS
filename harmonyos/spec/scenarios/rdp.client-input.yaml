schema: 1
id: rdp.client-input
title: RDP 输入回传：客户端连本机服务端后发键鼠，服务端计数必须增加
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - E04
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 4000
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "New Host|新建主机"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 900
  - action: click
    target: id:rdp/srv-start
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "running port=13389"
      withinMs: 15000
  # 先渲染一次建立会话（输入探针同样需要连上服务端）
  - action: type
    target: id:rdp/host
    text: 127.0.0.1
  - action: type
    target: id:rdp/port
    text: "13389"
  - action: type
    target: id:rdp/user
    text: tester
  - action: type
    target: id:rdp/pass
    secret: true
    text: secret
  - action: click
    target: id:rdp/render
  - action: wait
    ms: 8000
  # 发键鼠
  - action: click
    target: id:rdp/input
  - action: wait
    ms: 6000
asserts:
  - kind: screenRegex
    regex: "serverSaw keys=[1-9][0-9]*"
    withinMs: 20000
  - kind: screenRegex
    regex: "mouse=[1-9][0-9]*"
    withinMs: 8000
  - kind: absent
    value: "connect failed"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：客户端连本机服务端后发送键盘与鼠标事件，服务端计数（keys/mouse）确实增加。
    **不覆盖**：输入落到真实 Windows 桌面后的效果（无真实 RDP 对端）、组合键/Unicode 输入、
    剪贴板与多显示器。
deviations:
  - 对端是同一 App 内的内置 shadow 服务端，不是真实 Windows。
notes: >-
  "服务端收到"用服务端自己的计数器证明（inK/inM 与 probe 返回值），不靠"看起来连上了"。
