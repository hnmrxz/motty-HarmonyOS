schema: 1
id: settings.ui-scale
title: 设置界面字号（小/标准/大）：切换后重启保持
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
  - action: click
    target: id:settings/scale-large
  - action: wait
    ms: 500
  - action: click
    target: id:settings/close
  - action: wait
    ms: 500
  - action: restart
  - action: wait
    ms: 7000
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
asserts:
  - kind: screenRegex
    regex: "字号: 大|Text: large"
    withinMs: 8000
  - kind: screenRegex
    regex: "字号: 标准|Text: regular"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：设置里三档界面字号按钮存在，选"大"后重启仍保持。
    **不覆盖**：字号实际像素效果（dump 不含 fontSize，属 E2 代码层）、缩放对全部文字的一致性。
deviations:
  - 只断言按钮文案与重启保持；像素级效果需目视。
notes: >-
  uiScaleKey 存 DB；fs() 只缩放文字尺寸（0.9/1.0/1.15），不动布局常量。
