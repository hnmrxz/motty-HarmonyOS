schema: 1
id: page.local-terminal
title: 本地终端页：如实说明沙箱限制并给出替代入口（不再是死链）
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/local-terminal
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "本地终端|Local terminal"
      withinMs: 8000
asserts:
  - kind: screenRegex
    regex: "沙箱|sandbox"
    withinMs: 6000
  - kind: screenRegex
    regex: "打开调试页|Open debug"
    withinMs: 6000
  - kind: screenRegex
    regex: "回到主机|Back to hosts"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：侧栏"本地终端"不再是死链，页面说明沙箱限制并给出替代入口。
    **不覆盖**：真实本地 shell（HarmonyOS 沙箱不支持，故不实现）。
deviations:
  - 这是"诚实说明页"；不做假终端。
notes: >-
  HarmonyOS 应用不能 fork/exec 本地 shell，故提供 SSH 夹具与调试页 pty shell 作为替代路径。
