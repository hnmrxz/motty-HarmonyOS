schema: 1
id: host.grid-meta
title: 网格视图也显示主机图标与最近连接（与列表一致）
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts|RDP 服务启动"
      withinMs: 10000
  - action: wait
    ms: 1000
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts"
      withinMs: 10000
  - action: wait
    ms: 800
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 800
  # 建一台选中 ⚡ 图标的主机
  - action: click
    target: id:shell/add-host
  - action: click
    target: id:hostform/icon-bolt
  - action: type
    target: id:shell/dialog-label
    text: grid-meta
  - action: type
    target: id:shell/dialog-address
    text: 10.7.7.9
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
  # 切网格视图
  - action: click
    target: id:view/grid
  - action: wait
    ms: 1200
    expect:
      kind: screenRegex
      regex: "grid-meta"
      withinMs: 10000
asserts:
  - kind: screenRegex
    regex: "⚡"
    withinMs: 8000
  - kind: screenRegex
    regex: "未连接|never connected"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：网格卡片显示主机图标字形（⚡）与「未连接」文案。
    **不覆盖**：网格里连接后的"最近连接 HH:MM"（同列表逻辑，已在 host.lastused 覆盖数据来源）、
    卡片悬停样式。
deviations:
  - 只断言字形与"未连接"同时出现在网格视图，不逐卡片绑定 id。
notes: >-
  这一条保证"列表与网格两种视图信息一致"，避免只在列表加了图标/最近连接。
