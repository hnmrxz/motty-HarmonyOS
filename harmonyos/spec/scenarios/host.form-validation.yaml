schema: 1
id: host.form-validation
title: 主机表单：非法颜色/标签被拦截并给出官方文案，修正后可保存
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:shell/add-host
  - action: wait
    ms: 1000
  - action: type
    target: id:shell/dialog-label
    text: valid-a
  - action: type
    target: id:shell/dialog-address
    text: 10.3.3.3
  # 非法颜色：应被拦截且弹官方文案
  - action: type
    target: id:shell/dialog-color
    text: zzz
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "请输入 #3B82F6 这样的颜色值|ErrHostColorInvalid|颜色值"
      withinMs: 8000
  # 改成合法颜色后保存成功
  - action: click
    target: id:hostform/color/3b82f6
  - action: wait
    ms: 500
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1500
asserts:
  - kind: screenRegex
    regex: "valid-a"
    withinMs: 12000
  - kind: absent
    value: "请输入 #3B82F6 这样的颜色值"
    withinMs: 3000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：非法颜色被拦截并显示官方文案、选色板后保存成功、错误行在成功后消失。
    **不覆盖**：标签数量/长度校验（需要大量输入，单独用例）、颜色像素校验、编辑态错误清除。
deviations:
  - 只测颜色分支；标签分支同一实现，但输入 13 个标签在 UI 自动化里成本高，暂不覆盖。
notes: >-
  断言同时接受中文官方文案与英文键名，避免语言状态影响判断。
