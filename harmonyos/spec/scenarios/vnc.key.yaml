schema: 1
id: vnc.key
title: VNC 键盘事件：按键到达对端并以洋红像素体现（与指针绿色区分）
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - E02
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 4000
  skipFresh: true
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "New Host|新建主机"
      withinMs: 20000
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: vnckey-host
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 800
  - action: click
    target: id:diag/open
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts|RDP 服务启动"
      withinMs: 10000
  - action: wait
    ms: 600
  # 面板已分页：调试类按钮在「调试」页
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts"
      withinMs: 10000
  - action: click
    target: id:vnc/session
  - action: wait
    ms: 3000
    expect:
      kind: screenRegex
      regex: "frame=[1-9][0-9]*"
      withinMs: 20000
  # 发一个按键（夹具把按键区域涂成洋红）
  - action: click
    target: id:vnc/key
  - action: wait
    ms: 2500
asserts:
  - kind: screenRegex
    regex: "magenta=[1-9][0-9]*"
    withinMs: 15000
  - kind: absent
    value: "error unexpected message"
    withinMs: 3000
  - kind: absent
    value: "error read update"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    模拟器双画像（x86_64, API 26）。覆盖：KeyEvent 编码（down）与对端反馈（洋红像素计数）、
    客户端画面统计里 magenta 从 0 变为非 0。
    **不覆盖**：up 事件、组合键/修饰键、keysym 映射表、真实 VNC 服务端的键位语义；
    未在 arm64 真机执行。
deviations:
  - 纯新增规格，无 upstream 对应脚本
  - 夹具约定：指针按下涂绿、按键按下涂洋红，两者用不同计数区分
notes: >-
  断言 magenta>0 而不是"发了按键"：只有对端收到并回传新帧，客户端统计里才会出现洋红。
