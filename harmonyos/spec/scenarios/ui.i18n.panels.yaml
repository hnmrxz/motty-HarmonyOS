schema: 1
id: ui.i18n.panels
title: 面板文案取词：SFTP 面板按钮与标题随语言变化，且不出现键名
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - H08
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  # 卸载重装会由备份恢复数据，必须先显式重置（见 RUNBOOK "测试隔离"）
  - action: click
    target: id:diag/open
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts|RDP 服务启动"
      withinMs: 10000
  - action: wait
    ms: 600
  # 面板已分页：调试类按钮在「调试」页
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts"
      withinMs: 10000
  - action: wait
    ms: 1200
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 900
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: i18n-panel
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 900
  # 清空已知主机：重装会恢复历史数据，指纹已在库里时信任对话框不会出现（实测踩过）
  - action: click
    target: id:known/open
  - action: wait
    ms: 700
  - action: click
    target: id:known/clear
  - action: wait
    ms: 700
  - action: click
    target: id:known/close
  - action: wait
    ms: 500
  - action: click
    target: id:host-files/0
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "信任此主机|Trust this host|Unknown host key"
      withinMs: 15000
  - action: click
    target: id:hostkey/trust
  - action: wait
    ms: 3000
asserts:
  # 面板标题与按钮两种语言都必须来自词表（不能漏成英文硬编码）
  - kind: screenRegex
    regex: "文件（SFTP）|Files \\(SFTP\\)"
    withinMs: 15000
  - kind: screenRegex
    regex: "下载|Download"
    withinMs: 8000
  - kind: screenRegex
    regex: "上传|Upload"
    withinMs: 8000
  - kind: screenRegex
    regex: "上级|Up"
    withinMs: 8000
  - kind: screenRegex
    regex: "列出|List"
    withinMs: 8000
  # 缺键会以键名显示，这里必须一个都不出现
  - kind: absent
    value: "sftp.title"
    withinMs: 2000
  - kind: absent
    value: "sftp.download"
    withinMs: 2000
  - kind: absent
    value: "sftp.upload"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：SFTP 面板标题/下载/上传/上级/列表 两组语言取词、以及"键名泄漏"的反向检测。
    **不覆盖**：转发表单与 VNC 面板的逐条文案、跟随系统语言热切换、第三种语言、复数与日期本地化、arm64 真机。
deviations:
  - 纯新增规格，无 upstream 对应脚本
notes: >-
  断言写成"中文|英文"两种：应用默认跟随系统（中文），但用例中途可能切过语言；
  只断言一种语言会把"语言状态"误判成"取词失败"。反向断言键名缺失，才说明这些按钮真的走了词表。
