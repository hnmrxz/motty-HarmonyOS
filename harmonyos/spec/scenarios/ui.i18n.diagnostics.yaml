schema: 1
id: ui.i18n.diagnostics
title: 面板级双语（四）：诊断面板分页后，调试页与 RDP 页的按钮文案随语言切换且无缺键
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - H08
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 4000
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "New Host|新建主机"
      withinMs: 20000
  - action: click
    target: id:ui/lang
  - action: click
    target: id:ui/lang
  - action: wait
    ms: 700
  - action: click
    target: id:diag/open
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts|RDP 服务启动"
      withinMs: 10000
  - action: wait
    ms: 900
  # 调试页：TCP 探测 / 主机密钥检查
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
    expect:
      kind: screenRegex
      regex: "catalog reset hosts"
      withinMs: 10000
  - action: wait
    ms: 1000
    expect:
      kind: screenRegex
      regex: "诊断"
      withinMs: 10000
  - action: wait
    ms: 200
    expect:
      kind: screenRegex
      regex: "TCP 探测"
      withinMs: 8000
  - action: wait
    ms: 200
    expect:
      kind: screenRegex
      regex: "主机密钥检查"
      withinMs: 8000
  # RDP 页：RDP 服务启动
  - action: click
    target: id:diag/tab-rdp
  - action: wait
    ms: 900
    expect:
      kind: screenRegex
      regex: "RDP 服务启动"
      withinMs: 8000
asserts:
  - kind: screenRegex
    regex: "RDP 服务启动"
    withinMs: 6000
  - kind: absent
    value: "TCP probe"
    withinMs: 3000
  - kind: absent
    value: "Hostkey check"
    withinMs: 3000
  - kind: absent
    value: "RDP srv start"
    withinMs: 3000
  - kind: absent
    value: "diag.title"
    withinMs: 2000
  - kind: absent
    value: "rdp.srvStart"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    模拟器双画（x86_64, API 26）。覆盖：分页后「调试」页的 TCP 探测/主机密钥检查文案、
    「RDP」页的 RDP 服务启动文案，以及中文界面下不出现英文原文或键名。
    **不覆盖**：RDP :3390/:2222 探测按钮、状态行、第三种语言。
deviations:
  - 面板已分页：调试页与 RDP 页的断言必须分别在对应页执行（不能同时断言两页文案）。
notes: >-
  反向断言英文原文与键名同时缺席，才说明这些按钮确实走了取词表。
