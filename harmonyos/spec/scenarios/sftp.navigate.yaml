schema: 1
id: sftp.navigate
title: SFTP 目录导航：进入子目录、返回上级，路径与列表同步
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - C01
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: nav-host
  - action: type
    target: id:shell/dialog-address
    text: 127.0.0.1
  - action: type
    target: id:shell/dialog-user
    text: tester
  - action: type
    target: id:shell/dialog-port
    text: "2222"
  - action: type
    target: id:shell/dialog-password
    text: secret
    secret: true
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 700
  - action: click
    target: id:host-files/0
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "信任此主机|Unknown host key"
      withinMs: 12000
  - action: click
    target: id:hostkey/trust
  - action: wait
    ms: 3000
    expect:
      kind: screenRegex
      regex: "hello.txt"
      withinMs: 15000
  # 先建一个目录（否则没有可进入的子目录）
  - action: click
    target: id:sftp/mkdir
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "newdir/"
      withinMs: 12000
  # 进入 newdir/
  - action: click
    target: id:sftp/entry/newdir/
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "listed newdir"
      withinMs: 12000
  # 返回上级
  - action: click
    target: id:sftp/up
  - action: wait
    ms: 2500
asserts:
  - kind: screenRegex
    regex: "listed \\."
    withinMs: 12000
  - kind: screenRegex
    regex: "hello.txt"
    withinMs: 8000
  - kind: absent
    value: "already at root"
    withinMs: 2000
  - kind: absent
    value: "error opendir failed"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    模拟器双画像（x86_64, API 26）。覆盖：目录条目带尾斜杠可识别、进入子目录后路径与列表同步、
    返回上级后恢复父目录列表。
    **不覆盖**：多级深路径、路径手动输入跳转（`sftp/path` 只做展示与文本输入，未做校验）、
    面包屑、书签、符号链接目录；未在 arm64 真机执行。
deviations:
  - 纯新增规格，无 upstream 对应脚本
  - 用"进入后 0 entries、返回后 >=1 entries"作为路径切换真的发生的判据
notes: >-
  只断言路径字符串变化不够：路径变了但列表没重列也会通过。
  因此同时断言两级的条目计数（0 -> 非 0），并断言父目录能看到 hello.txt。
