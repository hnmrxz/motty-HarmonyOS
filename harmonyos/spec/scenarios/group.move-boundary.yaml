schema: 1
id: group.move-boundary
title: 分组上/下移到边界时给出提示，而不是静默无反应
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 600
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 500
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1200
  - action: click
    target: id:diag/close
  - action: wait
    ms: 600
  # 建两台主机，分到两个分组
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: bound-a
  - action: type
    target: id:shell/dialog-address
    text: 10.40.40.1
  - action: type
    target: id:shell/dialog-group
    text: GA
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1200
  - action: key
    code: 2070
  - action: wait
    ms: 500
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: bound-b
  - action: type
    target: id:shell/dialog-address
    text: 10.40.40.2
  - action: type
    target: id:shell/dialog-group
    text: GB
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1200
  - action: key
    code: 2070
  - action: wait
    ms: 500
  # 打开第一个分组的菜单 -> 上移（已在顶部）
  - action: click
    target: id:group/menu/GA
  - action: wait
    ms: 700
  - action: click
    target: id:groupmenu/up
  - action: wait
    ms: 800
asserts:
  - kind: screenRegex
    regex: "已经是第一个分组|already the first group"
    withinMs: 8000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：分组在列表顶部时点上移，顶栏出现"已经是第一个分组"提示（不再静默）。
    **不覆盖**：底部下移提示（同源分支）、分组顺序变化本身（由 group-order 覆盖）。
deviations:
  - 只测上移边界；下移边界实现相同。
notes: >-
  moveGroup() 越界时改为 this.hint(...)，4 秒自动消失。
