schema: 1
id: settings.startup-view
title: 设置「启动打开什么」：选日志后重启直接进会话日志页
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:nav/settings
  - action: wait
    ms: 800
  - action: click
    target: id:settings/start-logs
  - action: wait
    ms: 600
  - action: click
    target: id:settings/close
  - action: wait
    ms: 600
  # 重启后应直接落在会话日志页（有搜索框 logs/search）
  - action: restart
  - action: wait
    ms: 7000
    expect:
      kind: screenRegex
      regex: "会话日志|Session logs"
      withinMs: 15000
asserts:
  - kind: screenRegex
    regex: "会话日志|Session logs"
    withinMs: 10000
  - kind: screenRegex
    regex: "清空|Clear"
    withinMs: 8000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：设置里选「启动: 日志」后重启，应用直接显示会话日志页。
    **不覆盖**：工作区分支、以及启动后切回主机的手动路径。
deviations:
  - 以"会话日志标题 + 清空按钮"同时出现在首屏作为判据，避免依赖导航选中态。
notes: >-
  startupView 存 DB ui_state，启动时 applyStartupView() 落到 pcNav。
