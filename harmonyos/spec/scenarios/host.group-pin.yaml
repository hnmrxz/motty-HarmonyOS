schema: 1
id: host.group-pin
title: 分组固定：固定 G2 后它排到 G1 前面，取消固定后恢复
sourceScript: null
pcOnly: true
profile:
  - 2in1
capabilities:
  - A03
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 1800
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "新建主机|New Host"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 600
  # 面板已分页：调试类按钮在「调试」页
  - action: click
    target: id:diag/tab-debug
  - action: wait
    ms: 1200
  - action: click
    target: id:catalog/reset-hosts
  - action: wait
    ms: 1500
  - action: click
    target: id:diag/close
  - action: wait
    ms: 800
  # 先建 G1，再建 G2（自然顺序 G1 在前）
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: pin-a
  - action: type
    target: id:shell/dialog-address
    text: 10.6.6.1
  - action: type
    target: id:shell/dialog-group
    text: G1
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1400
  - action: click
    target: id:shell/add-host
  - action: type
    target: id:shell/dialog-label
    text: pin-b
  - action: type
    target: id:shell/dialog-address
    text: 10.6.6.2
  - action: type
    target: id:shell/dialog-group
    text: G2
  - action: click
    target: id:shell/dialog-submit
  - action: wait
    ms: 1400
  # 固定 G2
  - action: click
    target: id:group/pin/G2
  - action: wait
    ms: 900
  - action: wait
    ms: 400
    expect:
      kind: before
      a: "id:group/header/G2"
      b: "id:group/header/G1"
      withinMs: 10000
  # 重启后固定状态应保持
  - action: restart
  - action: wait
    ms: 6000
  - action: wait
    ms: 300
    expect:
      kind: before
      a: "id:group/header/G2"
      b: "id:group/header/G1"
      withinMs: 10000
  # 取消固定后应回到自然顺序（G1 在前）
  - action: click
    target: id:group/pin/G2
  - action: wait
    ms: 900
asserts:
  # G2 必须排在 G1 前面
  # 固定标记出现在 G2 上（文本是 📌，同时确认 G1 有同样的节点但内容为空）
  - kind: before
    a: "id:group/header/G1"
    b: "id:group/header/G2"
    withinMs: 10000
  - kind: screenRegex
    regex: "G2"
    withinMs: 6000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：点分组表头的固定标记后，被固定分组排到未固定分组之前；
    重启后固定状态保持；取消固定后顺序回退。
    **不覆盖**：多个固定分组之间的相对顺序、固定状态随目录导出/导入。
deviations:
  - 用新增的 before 断言（比较两个节点 y 坐标）判定顺序，而不是靠文本顺序猜。
notes: >-
  固定排序只保证"固定的在前"，不改变固定组之间、非固定组之间的原有顺序。
