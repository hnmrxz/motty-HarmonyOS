schema: 1
id: rdp.client-render
title: RDP 客户端渲染管线：连本机内置服务端，收到桌面更新并绘制（画面内容仍待修）
sourceScript: null
profile:
  - 2in1
  - tablet
capabilities:
  - E04
app:
  bundleName: com.motty.harmony
  ability: EntryAbility
  settleMs: 4000
steps:
  - action: launch
  - action: wait
    ms: 800
    expect:
      kind: screenRegex
      regex: "New Host|新建主机"
      withinMs: 20000
  - action: click
    target: id:diag/open
  - action: wait
    ms: 900
  # 启动内置 shadow 服务端（本机 13389），客户端随后连它自己
  - action: click
    target: id:rdp/srv-start
  - action: wait
    ms: 2500
    expect:
      kind: screenRegex
      regex: "running port=13389"
      withinMs: 15000
  # 填客户端目标（不填 host 会连不上：实测默认空串直接失败）
  - action: click
    target: id:rdp/render
  - action: wait
    ms: 12000
asserts:
  # 真的收到桌面更新并触发绘制（frames/paints > 0）
  - kind: screenRegex
    regex: "rdp-render: frames=[1-9][0-9]* paints=[1-9][0-9]*"
    withinMs: 30000
  # 尺寸与像素数必须与服务端表面一致
  - kind: screenRegex
    regex: "size=1024x768 pixels=786432"
    withinMs: 8000
  # 位图解码链路必须真的有数据（bmp 更新与 rect 计数 > 0，valid=1）
  - kind: screenRegex
    regex: "bmp=[1-9][0-9]* rects=[1-9][0-9]*"
    withinMs: 8000
  - kind: screenRegex
    regex: "valid=1"
    withinMs: 6000
  - kind: absent
    value: "gdi_init failed"
    withinMs: 2000
evidence:
  png: true
  tree: true
  limits: >-
    PC（2in1）实测。覆盖：内置服务端启动、客户端连接本机服务端、收到桌面更新并绘制、
    位图解码链路有数据（bmp/rects>0、valid=1）、尺寸与像素数正确。
    **不覆盖(重要)**：像素内容正确性——实测 `colors=1` 且画布主色 `#FFFFFF`，
    说明解码出来的位图仍是全白（已知缺陷，见 RDP.md）。因此这条**不能**代表"画面可用"。
deviations:
  - 客户端与服务端都在同一 App 进程内（本机 127.0.0.1:13389），不是跨机 RDP。
  - 画面内容为全白是已知缺陷，用例只证明"管线通、数据到、绘制发生"。
notes: >-
  这条以前断言同样的正则但**从不填 host/port**，所以永远连不上；现在把目标字段填上，
  才真正跑通"客户端 ← 内置服务端"的渲染链路。
