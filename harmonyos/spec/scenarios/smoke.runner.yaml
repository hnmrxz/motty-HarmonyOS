schema: 1
id: smoke.runner
title: runner 自检（非产品规格）：点击按钮、查文本、出证据
profile:
  - 2in1
  - tablet
app:
  bundleName: com.motty.bprime
  ability: EntryAbility
  settleMs: 2000
capabilities: []
steps:
  - action: launch
  - action: click
    target: label:Re-run
  - action: wait
    ms: 800
asserts:
  - kind: text
    value: Re-run
    withinMs: 5000
  - kind: layout
    description: 带文本的节点都有正宽高且落在屏幕内
evidence:
  png: true
  tree: true
  limits: >-
    模拟器（x86_64, API 26）。这是 harness 自检，不是产品验收；只证明
    dumpLayout/screenCap/uiInput 三条原语与选择器解析可用，不代表任何 Motty 能力。
notes: >-
  目标应用是 harmonyos/spike/bprime 探针（含一个 Re-run 按钮）。此 spec 用来验证
  spec runner 端到端可用，用完后应随探针一起归档，不计入 82 个产品 spec。
deviations:
  - 非 upstream 脚本派生；无对应原件
